version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: captcha_x_lab_postgres
    environment:
      POSTGRES_USER: captcha_user
      POSTGRES_PASSWORD: captcha_password
      POSTGRES_DB: captcha_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: captcha_x_lab_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
