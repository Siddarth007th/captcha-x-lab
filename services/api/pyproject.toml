[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "celery>=5.6.3",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.5.6",
    "librosa>=1.0.0",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sentencepiece>=0.2.2",
    "soundfile>=0.14.0",
    "sqlalchemy>=2.0.54",
    "tiktoken>=0.14.0",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.29.0",
    "transformers>=5.17.0",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
